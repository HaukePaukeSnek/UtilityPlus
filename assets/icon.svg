<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: CS Orange -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="60%" stop-color="#E25807" />
      <stop offset="100%" stop-color="#B83E00" />
    </linearGradient>

    <!-- Subtle Vignette / Shadow -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </radialGradient>

    <!-- CS Tactical Blue Gradient -->
    <linearGradient id="csBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#034694" />
      <stop offset="100%" stop-color="#022859" />
    </linearGradient>

    <!-- Cyberpunk Pink Glow Filter -->
    <filter id="neonPinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF007F" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#FF007F" flood-opacity="0.5" />
    </filter>

    <!-- Dark Drop Shadow for text -->
    <filter id="csShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- App Icon Base: Rounded Square (macOS / App Icon style) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#vignette)" />
  
  <!-- Subtle CS Tactical Stripes Pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="3">
    <line x1="80" y1="30" x2="30" y2="80" />
    <line x1="140" y1="30" x2="30" y2="140" />
    <line x1="200" y1="30" x2="30" y2="200" />
    <line x1="482" y1="312" x2="312" y2="482" />
    <line x1="482" y1="372" x2="372" y2="482" />
    <line x1="482" y1="432" x2="432" y2="482" />
  </g>

  <!-- Outer Icon Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#000000" stroke-width="2" opacity="0.3" />

  <!-- Tactical Target / Reticle Accent in background -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#000000" stroke-width="3" opacity="0.15" stroke-dasharray="8 8" />
  <line x1="86" y1="256" x2="426" y2="256" stroke="#000000" stroke-width="2" opacity="0.12" />
  <line x1="256" y1="86" x2="256" y2="426" stroke="#000000" stroke-width="2" opacity="0.12" />

  <!-- MAIN LOGO CONTENT -->
  <!-- "UTILITY" in CS Military/Industrial Stencil Blue -->
  <g filter="url(#csShadow)">
    <!-- Main UTILITY text slanted like CS logo -->
    <text x="215" y="278" 
          font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', Impact, sans-serif" 
          font-size="82" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="-2"
          text-anchor="middle" 
          fill="url(#csBlue)"
          stroke="#051937"
          stroke-width="4"
          stroke-linejoin="miter">
      UTILITY
    </text>

    <!-- Top highlight stroke for metallic 3D CS finish -->
    <text x="215" y="275" 
          font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', Impact, sans-serif" 
          font-size="82" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="-2"
          text-anchor="middle" 
          fill="none"
          stroke="#7DD3FC"
          stroke-width="1.5"
          opacity="0.8">
      UTILITY
    </text>
  </g>

  <!-- CYBERPUNK PLUS (+) in Neon Magenta / Pink -->
  <g filter="url(#neonPinkGlow)">
    <!-- Cyberpunk Angular Tech PLUS Symbol -->
    <g transform="translate(378, 204) skewX(-12)">
      <!-- Vertical bar of Plus -->
      <polygon points="26,0 46,0 46,28 72,28 72,48 46,48 46,76 26,76 26,48 0,48 0,28 26,28" 
               fill="#FF007F" 
               stroke="#FFE4F1" 
               stroke-width="2" />
      <!-- Cyberpunk inner tech cut -->
      <line x1="12" y1="38" x2="60" y2="38" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
      <line x1="36" y1="14" x2="36" y2="62" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
    </g>
  </g>

  <!-- Subtitle badge: LINEUP WIZARD in tactical dark pill -->
  <g transform="translate(256, 335)">
    <rect x="-140" y="-18" width="280" height="36" rx="6" fill="#0A0D14" opacity="0.85" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <text x="0" y="6" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="800" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#F8FAFC">
      CS2 ASSISTANT
    </text>
  </g>
</svg>

